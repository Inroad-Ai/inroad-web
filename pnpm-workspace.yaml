allowBuilds:
  unrs-resolver: true
onlyBuiltDependencies:
  - unrs-resolver
  - fsevents
# Patched versions of transitive dependencies (pnpm audit, 2026-10-24).
# postcss-selector-parser is left on 6.x: its fix needs 7.x, which tailwind 3 does not support.
overrides:
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  js-yaml@4: ^4.3.2
  source-map-js@1: ^1.2.2
  postcss@8: ^8.5.31
