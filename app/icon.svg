<!-- Favicon. Same artwork as components/ui/Logo.tsx, but a static file can't
     read CSS custom properties, so the two token values are inlined here:
     #f2a91c is the signal amber token, #2b211d is the ink token. If either
     token changes in styles/tokens.css, change it here too. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="9" fill="#f2a91c" />
  <g
    transform="translate(1.5 0)"
    fill="none"
    stroke="#2b211d"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M9 21.5V15.5A5 5 0 0 1 14 10.5H20.5" />
    <path d="M17.25 6.75 21.75 10.5 17.25 14.25" />
  </g>
  <rect x="8.75" y="23.5" width="3.5" height="3.5" rx="1" fill="#2b211d" />
</svg>
