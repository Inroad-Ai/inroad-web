name: Bug report
description: Something in the app is broken or not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Do '...'
        3. See the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Where is this happening?
      options:
        - inroad-api (backend)
        - inroad-web (frontend)
        - Both / not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste any error messages, stack traces, or console output. Formatted as code automatically.
      render: shell
    validations:
      required: false
  - type: input
    id: branch
    attributes:
      label: Branch or commit
      description: Which branch or commit were you on when this happened?
    validations:
      required: false
